<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>СТОИТ ЛИ?</title>
<style>
:root{--bg:#f4f7fb;--card:rgba(255,255,255,.94);--text:#172033;--muted:#6b7280;--line:#dce3ec;--accent:#0b1220;--blue:#2f80ed}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}
.hero{min-height:300px;padding:28px 20px 32px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.5)),url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1600&q=80") center/cover}
.hero h1{font-size:38px;margin:0 0 8px;font-weight:850;letter-spacing:-1px}.hero p{font-size:19px;line-height:1.35;margin:0;max-width:760px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.stat{padding:12px 18px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.18);backdrop-filter:blur(12px);border-radius:22px;font-weight:750}
.container{max-width:1100px;margin:-38px auto 40px;padding:0 14px;position:relative}.toolbar{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);padding:14px;border-radius:26px;box-shadow:0 12px 40px rgba(15,23,42,.12)}
button,.btn{border:1px solid var(--line);background:#fff;color:#2877d8;padding:13px 18px;border-radius:17px;font-weight:750;font-size:16px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:#c0392b}
.card{background:var(--card);border:1px solid #e3e8ef;border-radius:24px;padding:22px;margin-top:18px;box-shadow:0 8px 30px rgba(15,23,42,.07)}
h2{margin:0 0 16px;font-size:26px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-weight:750}.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:15px;background:#fff;font:inherit}.field textarea{min-height:80px;resize:vertical}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.person{border:1px solid var(--line);border-radius:18px;padding:14px}.person h3{margin:0 0 10px}.score-row{display:grid;grid-template-columns:1fr 70px;align-items:center;gap:8px;margin:10px 0}.score-row input{width:70px;padding:10px;border:1px solid var(--line);border-radius:12px}
.criteria{display:grid;grid-template-columns:1fr;gap:10px}.criterion{border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff}.criterion-title{font-weight:800;margin-bottom:9px}.ratings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ratings label{font-size:13px;color:var(--muted)}.ratings input{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:11px}
.places{display:grid;gap:12px}.place{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fff}.place-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#eef5ff;color:#2672d4;font-weight:700;font-size:13px}.overall{font-size:28px;font-weight:850}.meta{color:var(--muted);margin-top:6px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{padding:6px 9px;border-radius:999px;background:#f0f3f7;font-size:12px}
#map{height:420px;border-radius:18px;overflow:hidden;background:#e9eef5}#mapFrame{width:100%;height:100%;border:0;display:block;border-radius:18px}.empty{padding:30px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9999}.modal.open{display:flex}.modal-box{width:min(900px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
@media(max-width:700px){.hero{min-height:270px}.hero h1{font-size:31px}.container{margin-top:-30px}.form-grid,.people{grid-template-columns:1fr}.ratings{grid-template-columns:repeat(3,1fr)}.field.full{grid-column:auto}}
</style>
</head>
<body>
<header class="hero">
<h1>СТОИТ ЛИ?</h1>
<p>Наш семейный рейтинг мест: где уже были, куда хотим и что реально стоит своих денег.</p>
<div class="stats">
<div class="stat">📍 <span id="countAll">0</span> мест</div>
<div class="stat">🟢 <span id="countBeen">0</span> были</div>
<div class="stat">🔵 <span id="countWant">0</span> хотим</div>
</div>
</header>

<main class="container">
<div class="toolbar">
<button onclick="showView('mapView')">🗺️ Карта</button>
<button onclick="showView('listView')">📍 Места</button>
<button class="primary" onclick="openModal()">＋ Добавить</button>
</div>

<section id="mapView" class="card">
<h2>Карта</h2><div id="map"><iframe id="mapFrame" title="Карта на русском" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
</section>

<section id="listView" class="card">
<h2>Наши места</h2>
<div id="places" class="places"></div>
</section>
</main>

<div id="modal" class="modal">
<div class="modal-box">
<div class="modal-head"><h2>Новое место</h2><button onclick="closeModal()">✕</button></div>
<div class="card" style="margin-top:0">
<div class="form-grid">
<div class="field full"><label>Название</label><input id="name" placeholder="Например, Чавенг, Самуи"></div>
<div class="field"><label>Статус</label><select id="status"><option value="been">🟢 Были</option><option value="want">🔵 Хотим</option></select></div>
<div class="field"><label>Категория</label><select id="category"><option>Страна</option><option>Город</option><option>Остров</option><option>Кафе</option><option>Ресторан</option><option>Бар</option><option>Массаж</option><option>Другое</option></select></div>
<div class="field"><label>Широта</label><input id="lat" type="number" step="any" placeholder="10.2167"></div>
<div class="field"><label>Долгота</label><input id="lng" type="number" step="any" placeholder="103.967"></div>
<div class="field full"><label>Комментарий</label><textarea id="note" placeholder="Что понравилось, что не понравилось..."></textarea></div>
</div>
</div>

<div class="card">
<h2>Оценки семьи</h2>
<p class="meta">Каждый ставит свою оценку от 1 до 10. Среднее считается автоматически.</p>
<div id="criteria" class="criteria"></div>
</div>

<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px">
<button onclick="closeModal()">Отмена</button><button class="primary" onclick="savePlace()">Сохранить место</button>
</div>
</div>
</div>

<script>
const KEY='stoitli_places_v2';
const criteria=[
['water_clarity','💧 Прозрачность воды'],
['water_temp','🌡️ Температура воды'],
['waves','🌊 Волны / море'],
['cleanliness','🧼 Чистота'],
['prices','💰 Цены'],
['people','🤝 Люди / доброжелательность'],
['beauty','🌴 Красота и уют'],
['land_greenery','🌿 Озеленение / флора на суше'],
['water_nature','🪸 Флора / природа в воде'],
['land_animals','🦎 Животные на суше'],
['water_animals','🐠 Животные в воде']
];
const people=['Антон','Жена','Сын'];

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a));}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function avgPlace(p){
 let vals=[];criteria.forEach(([k])=>people.forEach(x=>{let v=Number(p.scores?.[k]?.[x]);if(v>=1&&v<=10)vals.push(v)}));
 return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):0;
}
function avgCriterion(p,k){let v=[];people.forEach(x=>{let n=Number(p.scores?.[k]?.[x]);if(n>=1&&n<=10)v.push(n)});return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
function renderCriteria(existing={}){
 document.getElementById('criteria').innerHTML=criteria.map(([k,label])=>`<div class="criterion"><div class="criterion-title">${label}</div><div class="ratings">${people.map(person=>`<label>${person}<input type="number" min="1" max="10" step="1" data-k="${k}" data-p="${person}" value="${existing[k]?.[person]??''}" placeholder="1–10"></label>`).join('')}</div></div>`).join('');
}
function openModal(){renderCriteria();document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function savePlace(){
 const name=document.getElementById('name').value.trim();if(!name){alert('Введите название места');return}
 const scores={};criteria.forEach(([k])=>{scores[k]={};people.forEach(p=>{const el=document.querySelector(`[data-k="${k}"][data-p="${p}"]`);scores[k][p]=el.value===''?'':Number(el.value)})});
 const p={id:Date.now(),name,status:document.getElementById('status').value,category:document.getElementById('category').value,lat:Number(document.getElementById('lat').value)||null,lng:Number(document.getElementById('lng').value)||null,note:document.getElementById('note').value.trim(),scores};
 const all=load();all.push(p);saveAll(all);closeModal();clearForm();render();showView('listView');
}
function clearForm(){['name','lat','lng','note'].forEach(id=>document.getElementById(id).value='');document.getElementById('status').value='been';document.getElementById('category').value='Другое'}
function removePlace(id){if(confirm('Удалить это место?')){saveAll(load().filter(p=>p.id!==id));render()}}
function render(){
 const all=load();document.getElementById('countAll').textContent=all.length;document.getElementById('countBeen').textContent=all.filter(p=>p.status==='been').length;document.getElementById('countWant').textContent=all.filter(p=>p.status==='want').length;
 const box=document.getElementById('places');box.innerHTML=all.length?all.map(p=>{
  const av=avgPlace(p);const chips=criteria.map(([k,l])=>{const a=avgCriterion(p,k);return a?`<span class="chip">${l.split(' ').slice(1).join(' ')}: ${a.toFixed(1)}</span>`:''}).filter(Boolean).join('');
  return `<article class="place"><div class="place-head"><div><h3 style="margin:0 0 7px">${esc(p.name)}</h3><span class="badge">${p.status==='been'?'🟢 Были':'🔵 Хотим'} · ${esc(p.category)}</span></div><div class="overall">${av?av.toFixed(1):'—'}</div></div>${p.note?`<div class="meta">${esc(p.note)}</div>`:''}<div class="chips">${chips||'<span class="meta">Оценки пока не заполнены</span>'}</div><div style="margin-top:13px;text-align:right"><button class="danger" onclick="removePlace(${p.id})">Удалить</button></div></article>`
 }).join(''):'<div class="empty">Пока нет мест. Нажмите «Добавить».</div>';
 renderMap(all);
}
function mapZoom(points){
 if(!points.length)return 2;
 if(points.length===1)return 11;
 const lats=points.map(p=>p.lat), lngs=points.map(p=>p.lng);
 const span=Math.max(Math.max(...lats)-Math.min(...lats),Math.max(...lngs)-Math.min(...lngs));
 if(span>80)return 2;if(span>40)return 3;if(span>20)return 4;if(span>10)return 5;if(span>5)return 6;if(span>2)return 7;if(span>1)return 8;if(span>.5)return 9;if(span>.2)return 10;return 11;
}
function renderMap(all){
 const frame=document.getElementById('mapFrame');
 const points=all.filter(p=>Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lng)));
 let ll='80,20',z=2,pt='';
 if(points.length){
  const lat=points.reduce((a,p)=>a+Number(p.lat),0)/points.length;
  const lng=points.reduce((a,p)=>a+Number(p.lng),0)/points.length;
  ll=`${lng.toFixed(6)},${lat.toFixed(6)}`;z=mapZoom(points);
  pt=points.map(p=>`${Number(p.lng).toFixed(6)},${Number(p.lat).toFixed(6)},pm2rdm`).join('~');
 }
 const params=new URLSearchParams({ll,z:String(z),lang:'ru_RU'});
 if(pt)params.set('pt',pt);
 frame.src=`https://yandex.ru/map-widget/v1/?${params.toString()}`;
}
function showView(id){document.getElementById('mapView').style.display=id==='mapView'?'block':'none';document.getElementById('listView').style.display=id==='listView'?'block':'none';if(id==='mapView')renderMap(load())}
renderCriteria();render();showView('mapView');
</script>
</body>
</html>
