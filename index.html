<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>СТОИТ ЛИ?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f7fb;--card:rgba(255,255,255,.94);--text:#101828;--muted:#667085;--line:#e4e7ec;--blue:#2684ff;--green:#18a957;--red:#e5484d;--shadow:0 12px 35px rgba(16,24,40,.10);--radius:24px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text);background:var(--bg)}body{padding-bottom:88px}
.hero{min-height:300px;padding:28px 20px 32px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,rgba(5,19,39,.15),rgba(5,19,39,.72)),url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=85") center/cover}.hero:after{content:"";position:absolute;inset:auto -10% -100px;height:180px;background:linear-gradient(180deg,transparent,#f4f7fb)}.hero>*{position:relative;z-index:1}.brand{font-size:34px;font-weight:900;letter-spacing:-1.5px;margin-top:10px}.tagline{font-size:16px;line-height:1.4;max-width:440px;margin:8px 0 22px;color:rgba(255,255,255,.9)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:rgba(255,255,255,.18);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:10px 14px;font-weight:700}
.container{max-width:1100px;margin:-38px auto 0;padding:0 16px;position:relative;z-index:3}.card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.tabs{display:flex;gap:8px;overflow:auto}.tab{border:0;background:#fff;color:var(--blue);border:1px solid var(--line);border-radius:16px;padding:13px 18px;font-size:16px;font-weight:750;white-space:nowrap}.tab.active{background:#111827;color:#fff;border-color:#111827}.section{margin-top:16px}.section h2{font-size:22px;margin:0 0 12px}.map-card{padding:10px;overflow:hidden}#map{height:470px;border-radius:18px;z-index:1}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:12px 4px 2px;font-size:13px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px}.dot.blue{background:var(--blue)}.dot.green{background:var(--green)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:15px;padding:13px 16px;font-weight:800;cursor:pointer}.btn.primary{background:#111827;color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.light{background:#eef2f6;color:#172033}.btn.danger{background:#fff0f0;color:#b42318}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 7px;color:#344054}.field input,.field select,.field textarea{width:100%;border:1px solid #d8dee8;background:#fff;border-radius:14px;padding:13px 14px;outline:none}.field textarea{min-height:80px;resize:vertical}.rating-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0}.rating-row input{width:90px}.small{font-size:13px;color:var(--muted)}
.places{display:grid;gap:10px}.place{border:1px solid var(--line);border-radius:18px;padding:15px;background:#fff}.place-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.place-name{font-size:18px;font-weight:850}.place-meta{font-size:13px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:850}.badge.want{background:#e8f2ff;color:#0866d6}.badge.been{background:#e8f8ef;color:#08783b}.score{font-size:24px;font-weight:900}.score span{font-size:13px;color:var(--muted);font-weight:600}.place-bottom{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-top:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:28px 12px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:1000}.modal.show{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.close{border:0;background:#eef2f6;border-radius:50%;width:40px;height:40px;font-size:22px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;z-index:900}.bottom-nav button{flex:1;border:0;background:transparent;border-radius:14px;padding:10px 5px;font-weight:750;color:var(--muted)}.bottom-nav button.active{background:#111827;color:#fff}.leaflet-popup-content-wrapper{border-radius:16px}.popup-title{font-weight:900;font-size:16px}.popup-score{font-weight:900;font-size:22px;margin-top:4px}
@media(max-width:650px){.hero{min-height:270px}.brand{font-size:31px}.container{margin-top:-32px}#map{height:55vh;min-height:390px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:15px}.toolbar .btn{flex:1}}
</style>
</head>
<body>
<header class="hero"><div class="brand">СТОИТ ЛИ?</div><div class="tagline">Наш семейный рейтинг мест: где уже были, куда хотим и что реально стоит своих денег.</div><div class="stats"><div class="stat">📍 <span id="statPlaces">0</span> мест</div><div class="stat">🟢 <span id="statBeen">0</span> были</div><div class="stat">🔵 <span id="statWant">0</span> хотим</div></div></header>
<main class="container"><div class="card"><div class="tabs"><button class="tab active" data-view="mapView">🗺️ Карта</button><button class="tab" data-view="listView">📍 Места</button><button class="tab" data-view="addView">➕ Добавить</button></div></div>
<section id="mapView" class="section view"><div class="card map-card"><div class="toolbar"><button class="btn green" id="showBeen">🟢 Были</button><button class="btn blue" id="showWant">🔵 Хотим</button><button class="btn light" id="showAll">Все</button></div><div id="map"></div><div class="legend"><span><i class="dot green"></i>Были</span><span><i class="dot blue"></i>Хотим</span><span>⭐ На карте сразу виден ваш рейтинг</span></div></div></section>
<section id="listView" class="section view" style="display:none"><div class="card"><div class="toolbar"><select id="filterStatus" class="btn light"><option value="all">Все</option><option value="been">🟢 Были</option><option value="want">🔵 Хотим</option></select><select id="filterCategory" class="btn light"><option value="all">Все категории</option><option>Страна</option><option>Город</option><option>Остров</option><option>Кафе</option><option>Ресторан</option><option>Бар</option><option>Массаж</option><option>Другое</option></select></div><div id="places" class="places"></div></div></section>
<section id="addView" class="section view" style="display:none"><div class="card"><h2>Новое место</h2><p class="small">Нажмите «Выбрать точку на карте», затем тапните нужное место.</p><form id="placeForm"><div class="form-grid"><div class="field full"><label>Название</label><input id="name" required placeholder="Например: Фукуок"></div><div class="field"><label>Статус</label><select id="status"><option value="been">🟢 Были</option><option value="want">🔵 Хотим</option></select></div><div class="field"><label>Категория</label><select id="category"><option>Страна</option><option>Город</option><option>Остров</option><option>Кафе</option><option>Ресторан</option><option>Бар</option><option>Массаж</option><option>Другое</option></select></div><div class="field"><label>Широта</label><input id="lat" type="number" step="any" required placeholder="10.2167"></div><div class="field"><label>Долгота</label><input id="lng" type="number" step="any" required placeholder="103.967"></div><div class="field full"><button type="button" class="btn light" id="pickOnMap">📍 Выбрать точку на карте</button></div><div class="field full"><label>Оценки 1–10</label><div class="rating-row"><span>Вы</span><input id="rMe" type="number" min="1" max="10" placeholder="—"></div><div class="rating-row"><span>Жена</span><input id="rWife" type="number" min="1" max="10" placeholder="—"></div><div class="rating-row"><span>Сын</span><input id="rSon" type="number" min="1" max="10" placeholder="—"></div></div><div class="field full"><label>Комментарий</label><textarea id="note" placeholder="Что понравилось, цены, море, люди, еда и т.д."></textarea></div><div class="field full"><button class="btn primary" style="width:100%;font-size:17px">Сохранить место</button></div></div></form></div></section></main>
<div class="modal" id="modal"><div class="sheet"><div class="sheet-head"><h2 style="margin:0">Место</h2><button class="close" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<nav class="bottom-nav"><button class="active" data-nav="mapView">🗺️<br>Карта</button><button data-nav="listView">📍<br>Места</button><button data-nav="addView">➕<br>Добавить</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY="stoitli_places_v2";let places=JSON.parse(localStorage.getItem(KEY)||"[]"),map,markers=[],mapFilter="all",picking=false;
function save(){localStorage.setItem(KEY,JSON.stringify(places))}function avg(p){const a=[p.me,p.wife,p.son].map(Number).filter(n=>n>=1&&n<=10);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}function color(s){return s==="been"?"#18a957":"#2684ff"}function icon(s){return L.divIcon({className:"",html:`<div style="width:22px;height:22px;border-radius:50%;background:${color(s)};border:3px solid white;box-shadow:0 2px 8px #0005"></div>`,iconSize:[22,22],iconAnchor:[11,11]})}
function initMap(){map=L.map("map").setView([20,20],2);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);map.on("click",e=>{if(!picking)return;document.getElementById("lat").value=e.latlng.lat.toFixed(6);document.getElementById("lng").value=e.latlng.lng.toFixed(6);picking=false;showView("addView")});renderMarkers()}
function renderMarkers(){markers.forEach(m=>m.remove());markers=[];places.filter(p=>mapFilter==="all"||p.status===mapFilter).forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:icon(p.status)}).addTo(map),a=avg(p);m.bindPopup(`<div class="popup-title">${escapeHtml(p.name)}</div><div>${p.status==="been"?"🟢 Были":"🔵 Хотим"} · ${escapeHtml(p.category)}</div>${a?`<div class="popup-score">⭐ ${a.toFixed(1)}/10</div>`:"<div style='margin-top:5px;color:#667085'>Рейтинг пока не поставлен</div>"}<div style="margin-top:6px"><button class="btn light" onclick="openPlace('${p.id}')">Подробнее</button></div>`);markers.push(m)})}
function renderList(){const fs=document.getElementById("filterStatus").value,fc=document.getElementById("filterCategory").value,arr=places.filter(p=>(fs==="all"||p.status===fs)&&(fc==="all"||p.category===fc)),el=document.getElementById("places");if(!arr.length){el.innerHTML=`<div class="empty">Пока нет мест.<br><b>Добавьте первое</b> — оно сразу появится на карте.</div>`;return}el.innerHTML=arr.map(p=>{const a=avg(p);return `<article class="place"><div class="place-head"><div><div class="place-name">${escapeHtml(p.name)}</div><div class="place-meta">${escapeHtml(p.category)} · ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</div></div><span class="badge ${p.status}">${p.status==="been"?"🟢 Были":"🔵 Хотим"}</span></div><div class="place-bottom"><div>${a?`<div class="score">⭐ ${a.toFixed(1)} <span>/ 10</span></div>`:`<div class="small">Рейтинг не поставлен</div>`}${p.note?`<div class="small" style="margin-top:5px">${escapeHtml(p.note)}</div>`:""}</div><div class="actions"><button class="btn light" onclick="focusPlace('${p.id}')">🗺️ Карта</button><button class="btn danger" onclick="removePlace('${p.id}')">Удалить</button></div></div></article>`}).join("")}
function updateStats(){document.getElementById("statPlaces").textContent=places.length;document.getElementById("statBeen").textContent=places.filter(p=>p.status==="been").length;document.getElementById("statWant").textContent=places.filter(p=>p.status==="want").length}
function showView(id){document.querySelectorAll(".view").forEach(v=>v.style.display=v.id===id?"block":"none");document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===id));document.querySelectorAll(".bottom-nav button").forEach(b=>b.classList.toggle("active",b.dataset.nav===id));if(id==="mapView"&&map)setTimeout(()=>map.invalidateSize(),80);window.scrollTo({top:0,behavior:"smooth"})}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function openPlace(id){const p=places.find(x=>x.id===id);if(!p)return;const a=avg(p);document.getElementById("modalBody").innerHTML=`<h3 style="font-size:24px;margin:0 0 6px">${escapeHtml(p.name)}</h3><div class="small">${escapeHtml(p.category)} · ${p.status==="been"?"🟢 Были":"🔵 Хотим"}</div>${a?`<div style="font-size:38px;font-weight:900;margin:14px 0">⭐ ${a.toFixed(1)} <span style="font-size:15px;color:#667085">/ 10</span></div>`:"<p class='small' style='margin-top:16px'>Общего рейтинга пока нет.</p>"}<div class="card" style="box-shadow:none;border:1px solid var(--line);padding:12px;margin-top:10px"><div class="rating-row"><b>Вы</b><b>${p.me||"—"}</b></div><div class="rating-row"><b>Жена</b><b>${p.wife||"—"}</b></div><div class="rating-row"><b>Сын</b><b>${p.son||"—"}</b></div></div>${p.note?`<p style="line-height:1.5">${escapeHtml(p.note)}</p>`:""}<button class="btn danger" style="width:100%;margin-top:10px" onclick="removePlace('${p.id}');closeModal()">Удалить место</button>`;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}function focusPlace(id){const p=places.find(x=>x.id===id);if(!p)return;showView("mapView");setTimeout(()=>{map.setView([p.lat,p.lng],12);markers.find(m=>m.getLatLng().lat===p.lat&&m.getLatLng().lng===p.lng)?.openPopup()},100)}function removePlace(id){if(!confirm("Удалить это место?"))return;places=places.filter(p=>p.id!==id);save();updateStats();renderList();renderMarkers()}
document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.view)));document.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>showView(b.dataset.nav)));document.getElementById("showBeen").onclick=()=>{mapFilter="been";renderMarkers()};document.getElementById("showWant").onclick=()=>{mapFilter="want";renderMarkers()};document.getElementById("showAll").onclick=()=>{mapFilter="all";renderMarkers()};document.getElementById("filterStatus").onchange=renderList;document.getElementById("filterCategory").onchange=renderList;document.getElementById("pickOnMap").onclick=()=>{picking=true;showView("mapView");alert("Теперь нажмите на нужное место на карте. Координаты заполнятся автоматически.")};document.getElementById("closeModal").onclick=closeModal;document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.getElementById("placeForm").addEventListener("submit",e=>{e.preventDefault();const p={id:Date.now().toString(),name:document.getElementById("name").value.trim(),status:document.getElementById("status").value,category:document.getElementById("category").value,lat:Number(document.getElementById("lat").value),lng:Number(document.getElementById("lng").value),me:Number(document.getElementById("rMe").value)||null,wife:Number(document.getElementById("rWife").value)||null,son:Number(document.getElementById("rSon").value)||null,note:document.getElementById("note").value.trim()};if(!p.name||!Number.isFinite(p.lat)||!Number.isFinite(p.lng))return;places.push(p);save();updateStats();renderList();renderMarkers();e.target.reset();showView("mapView");setTimeout(()=>map.setView([p.lat,p.lng],8),100)});
window.openPlace=openPlace;window.focusPlace=focusPlace;window.removePlace=removePlace;window.closeModal=closeModal;initMap();updateStats();renderList();
</script>
</body>
</html>
