<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>СТОИТ ЛИ?</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--good:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:720px;margin:auto;padding:16px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:25px;font-weight:800;letter-spacing:-.8px}.sub{font-size:12px;color:var(--muted)}
button,input,select,textarea{font:inherit}.btn{border:0;border-radius:14px;padding:12px 15px;background:var(--accent);color:#fff;font-weight:700}.btn.secondary{background:#fff;color:var(--text);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.03)}
h1{font-size:28px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;outline:none}.field textarea{min-height:70px;resize:vertical}
.cat{padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;text-align:left;font-weight:700}.cat small{display:block;color:var(--muted);font-weight:500;margin-top:4px}
.rating-row{padding:12px 0;border-bottom:1px solid var(--line)}.rating-row:last-child{border-bottom:0}.crit{font-weight:700}.weight{font-size:11px;color:var(--muted)}
.person{margin-top:10px}.person-title{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
.scores{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}.scores button{padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px}.scores button.on{background:#111827;color:#fff;border-color:#111827}
.actions{position:fixed;bottom:0;left:0;right:0;background:rgba(245,247,251,.94);backdrop-filter:blur(12px);padding:10px 14px env(safe-area-inset-bottom);z-index:10}.actions-inner{max-width:720px;margin:auto;display:flex;gap:8px}.actions .btn{flex:1}
.result{text-align:center}.big{font-size:48px;font-weight:850;letter-spacing:-2px}.verdict{font-size:16px;font-weight:800}.meters{display:grid;gap:8px;margin-top:12px}.meter{display:flex;justify-content:space-between;font-size:13px}.bar{height:7px;background:#eef0f4;border-radius:99px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:#111827;border-radius:99px}
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.nav button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:700}.nav button.active{background:#111827;color:#fff}
.list-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.list-item:last-child{border-bottom:0}.score{font-size:20px;font-weight:800}
.empty{text-align:center;padding:35px 10px;color:var(--muted)}
.smallbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px}
@media(max-width:390px){.scores button{font-size:10px}.scores{gap:2px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="actions" id="actions"></div>
<script>
const KEY="stoitli_v1";
const CATS={
"Страна":[["Люди / гостеприимство",15],["Красота и уют",12],["Природа и зелень",10],["Животный мир — суша",8],["Морская жизнь",8],["Чистота",10],["Цены",10],["Еда",10],["Безопасность",7],["Транспорт",5],["Удобство общения",5]],
"Пляж":[["Вода — прозрачность",12],["Вода — чистота",10],["Вода — цвет",8],["Купабельность",12],["Волны",8],["Пляж / песок",10],["Морская жизнь",10],["Природа и зелень",5],["Люди / гостеприимство",5],["Чистота",8],["Цена",5],["Еда рядом",4],["Людность",3]],
"Город / район":[["Красота и уют",15],["Природа и зелень",10],["Люди / гостеприимство",15],["Животный мир — суша",5],["Чистота",15],["Безопасность",10],["Еда",10],["Цены",10],["Транспорт",5],["Интересность",5]],
"Ресторан":[["Вкус",25],["Качество продуктов",15],["Цена",15],["Порции",10],["Сервис",10],["Чистота",10],["Атмосфера / уют",10],["Вернёмся?",5]],
"Массаж":[["Качество массажа",25],["Мастер",15],["Чистота",10],["Атмосфера / уют",10],["Комфорт",10],["Сервис",10],["Цена",15],["Вернёмся?",5]],
"Отель":[["Номер",15],["Кровать",10],["Чистота",15],["Сервис",10],["Завтрак",10],["Бассейн",5],["Локация",10],["Красота и уют",5],["Природа и зелень",5],["Инфраструктура",5],["Цена / качество",10]],
"Экскурсия":[["Организация",10],["Гид",15],["Интересность",20],["Красота / природа",15],["Комфорт",10],["Длительность",5],["Количество людей",5],["Цена",10],["Повторим?",10]],
"Покупка":[["Качество",20],["Цена",20],["Дизайн",10],["Удобство",10],["Надёжность",15],["Сервис",10],["Цена / качество",10],["Купили бы снова?",5]],
"Кафе":[["Вкус",25],["Кофе / напитки",15],["Цена",15],["Десерты",10],["Чистота",10],["Сервис",10],["Атмосфера / уют",10],["Вернёмся?",5]],
"Транспорт":[["Цена",20],["Комфорт",20],["Безопасность",20],["Удобство",15],["Чистота",10],["Сервис / люди",10],["Доступность",5]],
"Место / локация":[["Фотогеничность",15],["Красота и уют",15],["Природа и зелень",10],["Животный мир — суша",8],["Морская жизнь",8],["Чистота",10],["Доступность",10],["Насекомые — комфорт",8],["Семейность",10],["Вернёмся?",6]]
};
let data=JSON.parse(localStorage.getItem(KEY)||"[]"), screen="home", draft=null;

let historyBusy=false;

function go(nextScreen){
  screen=nextScreen;
  render();
}

window.addEventListener("popstate",function(){
  if(historyBusy)return;
  const next=history.state?.screen || "home";
  historyBusy=true;
  screen=next;
  render();
  historyBusy=false;
});

const originalRenderState={screen:"home"};
history.replaceState({screen:"home"},"","#home");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function avg(o){let a=Object.values(o||{}).filter(v=>typeof v==="number");return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function calc(item){
 let total=0, w=0; item.criteria.forEach((c,i)=>{let a=avg(item.scores[i]); if(a!=null){total+=a*c[1];w+=c[1]}}); return w?total/w:null
}
function verdict(x){if(x==null)return ["",""]; if(x>=9)return["🔥 ОБЯЗАТЕЛЬНО","good"]; if(x>=8)return["🟢 СТОИТ","good"]; if(x>=7)return["🟡 МОЖНО","warn"]; return["🔴 НЕ СТОИТ","bad"]}
function render(){if(!historyBusy){
  history.pushState({screen:screen},"","#"+screen);
}
 const app=document.getElementById("app"), actions=document.getElementById("actions");
 actions.innerHTML=screen==="form"?`<div class="actions-inner"><button class="btn secondary" onclick="go('home')">Отмена</button><button class="btn" onclick="finish()">Сохранить</button></div>`:"";
 if(screen==="home"){
  app.innerHTML=`<div class="top"><div><div class="logo">СТОИТ ЛИ?</div><div class="sub">Семейная система оценки путешествий</div></div><button class="btn" onclick="newForm()">＋ Оценить</button></div>
  <div class="nav"><button class="active">Места</button><button onclick="screen='stats';render()">Рейтинг</button><button onclick="screen='about';render()">Ещё</button></div>
  ${data.length?data.slice().reverse().map((x,idx)=>{let s=calc(x),v=verdict(s);return `<div class="card list-item"><div><b>${esc(x.place||"Без названия")}</b><div class="muted">${esc(x.category)} · ${esc(x.country||"")}</div></div><div style="text-align:right"><div class="score">${s?s.toFixed(1):"—"}</div><button class="smallbtn" onclick="openItem(${data.length-1-idx})">Открыть</button></div></div>`}).join(""):`<div class="card empty"><h2>Пока оценок нет</h2><p>Первой можно оценить пляж, ресторан, массаж или любое другое место.</p><button class="btn" onclick="newForm()">Создать первую оценку</button></div>`}`;
 } else if(screen==="form") renderForm(app);
 else if(screen==="stats") renderStats(app);
 else renderAbout(app);
}
function newForm(){draft={date:new Date().toISOString().slice(0,10),country:"",city:"",place:"",category:"Пляж",price:"",temp:"",return:"Не знаю",notes:"",scores:{}};draft.criteria=CATS[draft.category];draft.criteria.forEach((_,i)=>draft.scores[i]={});screen="form";render()}
function openItem(i){draft=JSON.parse(JSON.stringify(data[i]));draft.criteria=CATS[draft.category];screen="form";render()}
function renderForm(app){
 app.innerHTML=`<div class="top"><div><div class="logo">Новая оценка</div><div class="sub">Все три мнения заполняешь ты</div></div></div>
 <div class="card"><div class="grid">
 <div class="field"><label>Дата</label><input type="date" value="${draft.date}" onchange="draft.date=this.value"></div>
 <div class="field"><label>Цена / бюджет</label><input value="${esc(draft.price)}" placeholder="например $50" onchange="draft.price=this.value"></div>
 </div>
 <div class="grid"><div class="field"><label>Страна</label><input value="${esc(draft.country)}" onchange="draft.country=this.value"></div><div class="field"><label>Город / остров</label><input value="${esc(draft.city)}" onchange="draft.city=this.value"></div></div>
 <div class="field"><label>Место</label><input value="${esc(draft.place)}" placeholder="Например Chaweng Beach" onchange="draft.place=this.value"></div>
 <div class="field"><label>Категория</label><select onchange="changeCat(this.value)">${Object.keys(CATS).map(c=>`<option ${c===draft.category?"selected":""}>${c}</option>`).join("")}</select></div>
 </div>
 ${draft.criteria.map((c,i)=>`<div class="card rating-row"><div class="crit">${c[0]} <span class="weight">· ${c[1]}%</span></div>${["Антон","Жена","Сын"].map(p=>`<div class="person"><div class="person-title">${p}</div><div class="scores">${Array.from({length:11},(_,n)=>`<button class="${draft.scores[i]?.[p]===n?"on":""}" onclick="setScore(${i},'${p}',${n})">${n}</button>`).join("")}</div></div>`).join("")}</div>`).join("")}
 <div class="card"><h2>Факты и заметки</h2><div class="field"><label>🌡 Температура воды °C — не влияет на рейтинг</label><input type="number" step=".1" value="${esc(draft.temp)}" onchange="draft.temp=this.value"></div><div class="field"><label>❤️ Вернёмся?</label><select onchange="draft.return=this.value">${["Да","Нет","Не знаю"].map(x=>`<option ${x===draft.return?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Почему / заметка</label><textarea onchange="draft.notes=this.value">${esc(draft.notes)}</textarea></div></div>
 <div class="card result"><div class="muted">Предварительная семейная оценка</div><div class="big">${(calc(draft)||0).toFixed(1)}</div><div class="verdict">${verdict(calc(draft))[0]}</div></div>`;
}
function changeCat(c){draft.category=c;draft.criteria=CATS[c];draft.scores={};render()}
function setScore(i,p,n){draft.scores[i] ||= {};draft.scores[i][p]=n;render()}
function finish(){data.push(JSON.parse(JSON.stringify(draft)));save();screen="home";draft=null;render()}
function renderStats(app){
 let sorted=data.map((x,i)=>({x,i,s:calc(x)})).filter(z=>z.s!=null).sort((a,b)=>b.s-a.s);
 app.innerHTML=`<div class="top"><div><div class="logo">Рейтинг</div><div class="sub">Ваши места по семейной оценке</div></div><button class="btn" onclick="newForm()">＋</button></div>
 ${sorted.length?sorted.map((z,n)=>`<div class="card list-item"><div><b>${n+1}. ${esc(z.x.place)}</b><div class="muted">${esc(z.x.category)} · ${esc(z.x.country)}</div></div><div class="score">${z.s.toFixed(1)}</div></div>`).join(""):`<div class="card empty">Пока нет оценок.</div>`}`;
}
function renderAbout(app){app.innerHTML=`<div class="top"><div><div class="logo">СТОИТ ЛИ?</div><div class="sub">Версия 1.0</div></div></div><div class="card"><h2>Как работает</h2><p>Ты один заносишь мнение Антона, жены и сына. Каждому критерию присвоен вес, поэтому итог учитывает важность параметра.</p><p>Температура воды хранится отдельно и не портит сравнение разных сезонов.</p></div><div class="card"><h2>Данные</h2><p class="muted">Оценки пока хранятся прямо на этом телефоне в браузере.</p><button class="btn secondary" onclick="exportData()">Экспорт JSON</button> <button class="btn secondary" onclick="clearData()">Очистить</button></div>`}
function exportData(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="stoit-li-data.json";a.click()}
function clearData(){if(confirm("Удалить все оценки?")){data=[];save();render()}}
function go(s){screen=s;render()}
render();
</script>
</body>
</html>
